<!DOCTYPE html>
<html>
<head>
    <title>Tara Dota?</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            background-image: url("https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota2_social.jpg");
            background-size: cover;
            background-position: center;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin-top: 50px;
            font-size: 45px;
            text-shadow: 3px 3px 10px black;
        }

        button {
            padding: 15px 30px;
            font-size: 22px;
            margin: 20px;
            cursor: pointer;
            position: absolute;
            border: none;
            border-radius: 10px;
        }

        #yesBtn {
            position: relative;
            background-color: green;
            color: white;
        }

        #noBtn {
            background-color: red;
            color: white;
        }

        #imageContainer img {
            width: 260px;
            margin-top: 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px black;
        }
    </style>
</head>

<body>

    <h1 id="question">Tara laro? 😈</h1>

    <button id="yesBtn" onclick="sayYes()">YES 🔥</button>
    <button id="noBtn" onclick="sayNo()">NO ❌</button>

    <div id="imageContainer"></div>

    <script>
        let noSize = 22;
        let clickCount = 0;

        const messages = [
            "sige na tara ddots",
            "wala na talaga?",
            "play tayo bago mag 4.",
            "parang di pinapahiram ng bola, aray ko."
        ];

        const sadImages = [
            "sadcat.jpg",
            "saddog.jpg"
        ];

        function sayYes() {
            document.getElementById("question").innerHTML = "YUN OHHH 🔥🔥🔥";
            document.getElementById("noBtn").style.display = "none";

            let container = document.getElementById("imageContainer");
            container.innerHTML = "";

            let img = document.createElement("img");
            img.src = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/heroes/tidehunter_full.png";
            container.appendChild(img);
        }

        function sayNo() {
            let noBtn = document.getElementById("noBtn");

            // Change message
            if (clickCount < messages.length) {
                document.getElementById("question").innerHTML = messages[clickCount];
            } else {
                document.getElementById("question").innerHTML = messages[messages.length - 1];
            }

            clickCount++;

            // Move button randomly
            let x = Math.random() * (window.innerWidth - 120);
            let y = Math.random() * (window.innerHeight - 120);

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";

            // Shrink button safely
            if (noSize > 10) {
                noSize -= 2;
                noBtn.style.fontSize = noSize + "px";
            }

            // Show random sad image (YOUR images)
            let container = document.getElementById("imageContainer");
            container.innerHTML = "";

            let randomImage = sadImages[Math.floor(Math.random() * sadImages.length)];

            let img = document.createElement("img");
            img.src = randomImage;

            container.appendChild(img);
        }
    </script>

</body>
</html>
